spring:
  application:
    name: UniCircle
  datasource:
    url: jdbc:h2:mem:unicircle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: UniCircle
    stage: Sprint 10 staff review of lost and found
    data-status: Prototype fixtures only

unicircle:
  demo:
    username: ${UNICIRCLE_DEMO_USERNAME:student@demo.unicircle.test}
    password: ${UNICIRCLE_DEMO_PASSWORD:CampusDemo!2026}
  storage:
    profile-photos-dir: ${UNICIRCLE_PROFILE_PHOTOS_DIR:${java.io.tmpdir}/unicircle-profile-photos}
    lost-found-photos-dir: ${UNICIRCLE_LOST_FOUND_PHOTOS_DIR:${java.io.tmpdir}/unicircle-lost-found-photos}
