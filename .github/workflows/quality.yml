name: Quality checks

on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and browser logic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run Python tests with branch coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=70
          coverage xml

      - name: Run browser-side conversation tests
        run: node tests/test_conversation.js

      - name: Verify checked-in evaluation results
        run: python scripts/verify_evaluation.py

      - name: Verify checked-in TrustLab replay
        run: python scripts/verify_trustlab.py

      - name: Verify final evaluation gate or frozen replay
        run: python scripts/verify_final_evaluation.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
