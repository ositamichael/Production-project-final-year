services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unicircle
      POSTGRES_USER: unicircle
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - unicircle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicircle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  unicircle-postgres:
